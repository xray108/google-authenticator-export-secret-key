name: Release Build

on:
  push:
    tags:
      - "v*"  # Срабатывает только на теги, начинающиеся с v (например, v1.0, v2.3.4)

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Обязательно: дает права на создание релиза

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: GoogleAuthDecoder.exe
            asset_name: GoogleAuthDecoder-Windows.exe
          - os: ubuntu-latest
            artifact_name: GoogleAuthDecoder
            asset_name: GoogleAuthDecoder-Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --onefile --name GoogleAuthDecoder main.py

      # На Linux переименовываем файл перед загрузкой, чтобы было понятно
      - name: Rename Linux Binary (if Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/GoogleAuthDecoder dist/GoogleAuthDecoder-Linux

      # На Windows переименовываем файл
      - name: Rename Windows Binary (if Windows)
        if: matrix.os == 'windows-latest'
        run: move dist\GoogleAuthDecoder.exe dist\GoogleAuthDecoder-Windows.exe

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}